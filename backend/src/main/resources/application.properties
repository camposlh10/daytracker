spring.application.name=day-tracker-backend
spring.main.banner-mode=off

# Loopback only, on a free port chosen by the OS. The actual port is reported
# to the parent process through the DAYTRACKER_READY line on stdout.
server.address=127.0.0.1
server.port=0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Supplied by the Electron main process through the child environment.
# Never pass the token as a command-line argument.
daytracker.data-dir=${DAYTRACKER_DATA_DIR:}
daytracker.launch-token=${DAYTRACKER_TOKEN:}
daytracker.parent-watch=${DAYTRACKER_PARENT_WATCH:false}

# logging.file.name is set in DayTrackerBackendApplication from the data directory.
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB

# Filled in from the Maven project version; shown in backup metadata.
daytracker.app-version=@project.version@
